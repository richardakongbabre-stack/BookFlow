services:
  db:
    image: postgres:15-alpine
    container_name: bookflow-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bookflow
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bookflow-backend
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      JWT_SECRET: bookflow-super-secret-jwt-key-2026
      DATABASE_URL: postgresql://postgres:postgres@db:5432/bookflow?schema=public
    depends_on:
      db:
        condition: service_healthy
    # Deploy schema, seed mock data, and start server
    command: sh -c "npx prisma db push && npx prisma db seed && node dist/index.js"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bookflow-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata:
